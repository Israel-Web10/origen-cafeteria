# Nginx para ORIGEN en un VPS: sirve el frontend (dist) y hace de proxy de la API.
# Mismo dominio para todo → sin CORS entre orígenes y sin URLs locales incrustadas.
#
# 1) Copiar el build:   rsync -a frontend/dist/ /var/www/origen/
# 2) Certificado HTTPS gratuito (Let's Encrypt):  sudo certbot --nginx -d tu-dominio.com -d www.tu-dominio.com
# 3) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com;
    return 301 https://www.tu-dominio.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.tu-dominio.com;

    # Rutas que gestiona certbot
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    root /var/www/origen;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Recursos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /media/ {
        expires 30d;
        try_files $uri =404;
    }

    # API y archivos subidos → Node (solo escucha en 127.0.0.1)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /uploads/public/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # SPA: cualquier otra ruta devuelve index.html (sin caché)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

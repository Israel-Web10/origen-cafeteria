# Nginx para ORIGEN en un VPS: sirve el frontend (dist) y hace de proxy de la API.
# Mismo dominio para todo → sin CORS entre orígenes y sin URLs locales incrustadas.
#
# 1) Copiar el build:   rsync -a frontend/dist/ /var/www/origen/
# 2) Certificado HTTPS gratuito (Let's Encrypt):  sudo certbot --nginx -d tu-dominio.com -d www.tu-dominio.com
# 3) Cabeceras:  sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/origen-security-headers.conf
# 4) sudo nginx -t && sudo systemctl reload nginx

# ---------- Protección ante picos y abusos (contexto http) ----------
# Nginx ve TODO el tráfico (todos los procesos de Node), así que aquí está el
# tope global por IP. Generoso con la API general (muchas redes móviles comparten
# IP), estricto con login y creación de pedidos. Exceso → 429.
limit_req_zone  $binary_remote_addr zone=origen_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=origen_auth:10m  rate=10r/m;
limit_req_zone  $binary_remote_addr zone=origen_write:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=origen_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Conexiones reutilizadas hacia Node (evita abrir un socket TCP por petición)
upstream origen_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com;
    return 301 https://www.tu-dominio.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.tu-dominio.com;

    # Rutas que gestiona certbot
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    root /var/www/origen;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    include /etc/nginx/snippets/origen-security-headers.conf;
    # Máximo de conexiones simultáneas por IP (descargas, pestañas, etc.)
    limit_conn origen_conn 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Recursos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/origen-security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /media/ {
        expires 30d;
        try_files $uri =404;
    }

    # API y archivos subidos → Node (solo escucha en 127.0.0.1)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Login y registro: pocos intentos por IP (fuerza bruta)
    location ~ ^/api/(v1/)?auth/(login|register)$ {
        limit_req zone=origen_auth burst=10 nodelay;
        proxy_pass http://origen_api;
    }
    # Crear pedidos, enviar comprobantes y pagos de prueba
    location ~ ^/api/(v1/)?(orders|payments/orders/[0-9]+/(proof|card-test))$ {
        limit_req zone=origen_write burst=20 nodelay;
        limit_req zone=origen_api burst=40 nodelay;
        proxy_pass http://origen_api;
    }
    location /api/ {
        limit_req zone=origen_api burst=40 nodelay;
        proxy_pass http://origen_api;
        proxy_read_timeout 120s;
    }
    location /uploads/public/ {
        proxy_pass http://origen_api;
    }

    # SPA: cualquier otra ruta devuelve index.html (sin caché)
    location / {
        include /etc/nginx/snippets/origen-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

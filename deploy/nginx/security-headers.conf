# Cabeceras de seguridad de ORIGEN. Se incluyen en el server Y en cada location
# que use add_header: en Nginx, un add_header dentro de un location anula TODOS
# los heredados del server (si no, index.html saldría sin CSP ni HSTS).
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/origen-security-headers.conf
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

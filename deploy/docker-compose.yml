# Despliegue en un VPS propio con Docker Compose: PostgreSQL + API.
# El frontend (carpeta dist) lo sirve Nginx en el mismo servidor (ver deploy/nginx/origen.conf).
#
#   cp deploy/.env.production.example deploy/.env   # y completar valores
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# PostgreSQL NO se publica a Internet: solo es accesible dentro de la red interna de Docker.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      NODE_ENV: production
      TRUST_PROXY: 1
    volumes:
      - uploads:/app/uploads
    # Solo escucha en localhost; Nginx hace de proxy con HTTPS
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  pgdata:
  uploads:
